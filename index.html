<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Extraction Simulation</title>

<style>
    body {
        margin: 0;
        background: #030604;
        color: #00ff88;
        font-family: monospace;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .box {
        width: 90%;
        max-width: 700px;
        padding: 30px;
        border: 1px solid #00ff88;
        background: #07100b;
        text-align: center;
        box-shadow: 0 0 40px rgba(0,255,136,.12);
    }

    h1 {
        margin-top: 0;
    }

    input {
        display: none;
    }

    .button {
        display: inline-block;
        padding: 14px 25px;
        background: #00ff88;
        color: #001b0d;
        font-weight: bold;
        cursor: pointer;
        border-radius: 5px;
    }

    #preview {
        display: none;
        margin: 25px auto;
        max-width: 100%;
        max-height: 400px;
        border: 2px solid #00ff88;
        box-shadow: 0 0 25px rgba(0,255,136,.25);
    }

    .progress {
        height: 18px;
        border: 1px solid #00ff88;
        padding: 3px;
        margin-top: 20px;
    }

    #bar {
        width: 0%;
        height: 100%;
        background: #00ff88;
        transition: width .15s;
    }

    #status {
        margin-top: 15px;
        min-height: 25px;
    }

    #result {
        display: none;
        margin-top: 20px;
        color: #00ff88;
        font-size: 20px;
    }

    .terminal {
        text-align: left;
        direction: ltr;
        margin-top: 20px;
        height: 100px;
        overflow: hidden;
        color: #78ffb5;
        font-size: 13px;
    }
</style>
</head>

<body>

<div class="box">

    <h1>DEVICE PHOTO CONSOLE</h1>

    <p>PHOTO EXTRACTION SIMULATION</p>

    <label class="button">
        اختيار الصورة
        <input type="file" id="file" accept="image/*">
    </label>

    <img id="preview">

    <div class="terminal" id="terminal">
        > Waiting for image...
    </div>

    <div class="progress">
        <div id="bar"></div>
    </div>

    <div id="status">لم يتم اختيار صورة</div>

    <div id="result">
        ✓ SIMULATION COMPLETE
    </div>

</div>

<script>

const fileInput = document.getElementById("file");
const preview = document.getElementById("preview");
const bar = document.getElementById("bar");
const status = document.getElementById("status");
const terminal = document.getElementById("terminal");
const result = document.getElementById("result");

fileInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    // عرض الصورة التي اختارها المستخدم
    const reader = new FileReader();

    reader.onload = function (event) {

        preview.src = event.target.result;
        preview.style.display = "block";

        startSimulation(file.name);

    };

    reader.readAsDataURL(file);

});


function startSimulation(fileName) {

    let progress = 0;

    result.style.display = "none";

    terminal.innerHTML =
        "> Target image detected...<br>" +
        "> File: " + fileName + "<br>";

    status.textContent = "جاري تحليل الصورة...";

    bar.style.width = "0%";

    const messages = [
        "Reading image...",
        "Analyzing file...",
        "Preparing transfer...",
        "Processing image...",
        "Finalizing..."
    ];

    const timer = setInterval(function () {

        progress += Math.floor(Math.random() * 7) + 3;

        if (progress >= 100) {
            progress = 100;
            clearInterval(timer);

            bar.style.width = "100%";
            status.textContent = "اكتملت المحاكاة";

            terminal.innerHTML +=
                "> Image processed successfully.<br>" +
                "> 100% complete.<br>";

            result.style.display = "block";

            return;
        }

        bar.style.width = progress + "%";

        const index =
            Math.min(
                Math.floor(progress / 20),
                messages.length - 1
            );

        status.textContent =
            messages[index] + " " + progress + "%";

        if (Math.random() > .5) {

            terminal.innerHTML +=
                "> Processing block " +
                Math.floor(progress / 5) +
                "...<br>";

            terminal.scrollTop =
                terminal.scrollHeight;
        }

    }, 180);

}

</script>

</body>
</html>
